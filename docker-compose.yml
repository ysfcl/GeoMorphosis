services:
  ai-engine:
    build: ./ai-engine
    container_name: geomorphosis-ai-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_EARTH_ENGINE_PROJECT=geomorphosis
      - GOOGLE_EARTH_ENGINE_CREDENTIALS=/app/geomorphosis-cb3ae273c071.json
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./ai-engine:/app
      - ./data:/app/data
      - /app/venv
    restart: unless-stopped

  web-client:
    build:
      context: ./frontend
    container_name: geomorphosis-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./data:/app/data
    environment:
      - NEXT_PUBLIC_AI_ENGINE_URL=http://ai-engine:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - ai-engine

  worker:
    build: ./worker
    container_name: geomorphosis-worker
    restart: on-failure
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_URL=http://host.docker.internal:8000
    depends_on:
      - ai-engine
      - redis
    volumes:
      - ./data:/app/data
  redis:
    image: redis:alpine
    container_name: geomorphosis-redis
    ports:  
      - "6379:6379"
    restart: always