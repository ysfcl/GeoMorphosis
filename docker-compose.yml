services:
  ai-engine:
    build: ./ai-engine
    container_name: geomorphosis-ai-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_EARTH_ENGINE_PROJECT=geomorphosis
      - GOOGLE_EARTH_ENGINE_CREDENTIALS=/app/geomorphosis-cb3ae273c071.json
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Egitilmis agirlik: models/deforestation_yolov8_v2.pt -> deforestation_yolov8.pt
      # -> yolov8n.pt sirasiyla aranir. MODEL_PATH ile ozel bir yol verilebilir.
      - MODEL_PATH=${MODEL_PATH:-}
    volumes:
      - ./ai-engine:/app
      - ./data:/app/data
      - /app/venv
    depends_on:
      - redis
    restart: unless-stopped

  web-client:
    build:
      context: ./frontend
    container_name: geomorphosis-frontend
    # Dockerfile artik production build (npm run build + start) yapiyor;
    # lokal gelistirmede kaynak kodu volume ile ezip dev server'da kalmaya devam ediyoruz.
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./data:/app/data
    environment:
      - NEXT_PUBLIC_AI_ENGINE_URL=http://ai-engine:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # ai-engine ile ayni SQLite dosyasi (./data:/app/data mount'u)
      - DATABASE_URL=file:./data/geopulse.db
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${SMTP_USER}
      - NOTIFICATION_INTERNAL_SECRET=${NOTIFICATION_INTERNAL_SECRET}
    depends_on:
      - ai-engine

  worker:
    build: ./worker
    container_name: geomorphosis-worker
    restart: on-failure
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_URL=http://ai-engine:8000
      - FRONTEND_URL=http://web-client:3000
      - NOTIFICATION_INTERNAL_SECRET=${NOTIFICATION_INTERNAL_SECRET}
      # Erken uyari e-postasinin gidecegi adres (bos ise SMTP_USER kullanilir)
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      # Uydu indirme + YOLO icin ust sinir (ms)
      - ANALYSIS_TIMEOUT_MS=${ANALYSIS_TIMEOUT_MS:-180000}
    depends_on:
      - ai-engine
      - redis
    volumes:
      - ./data:/app/data
  redis:
    image: redis:alpine
    container_name: geomorphosis-redis
    ports:  
      - "6379:6379"
    restart: always
